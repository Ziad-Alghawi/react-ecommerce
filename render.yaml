services:
  - type: web
    name: react-ecommerce
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm --prefix ecommerce-backend ci
    startCommand: npm --prefix ecommerce-backend start
    healthCheckPath: /api/products
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Set in the dashboard. The VITE_ ones are read by the build, so redeploy after changing them
      - key: SUPABASE_URL
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
