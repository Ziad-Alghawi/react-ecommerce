<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ziad-Alghawi Store</title>
  <meta name="description"
    content="A full-stack demo store built with React, TypeScript and Express. Browse by category, apply a coupon and pay on delivery or by card with Stripe in test mode." />
  <meta name="theme-color" content="#0b4a2c" />

  <!-- Link previews on LinkedIn, X and others. X reads the og: tags too. Images need a full URL, which vite.config.ts fills in -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ziad-Alghawi Store" />
  <meta property="og:title" content="Ziad-Alghawi Store: everyday essentials, delivered" />
  <meta property="og:description"
    content="A full-stack demo store built with React, TypeScript and Express. Browse by category, apply a coupon and pay on delivery or by card with Stripe in test mode." />
  <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Ziad-Alghawi Store logo next to product cards for socks, a toaster, sunglasses and a tote bag" />
  <meta name="twitter:card" content="summary_large_image" />

  <base href="/" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
